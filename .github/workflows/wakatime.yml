# Atualiza data/wakatime.json uma vez por dia com as horas públicas do WakaTime.
# O site lê esse arquivo porque a API do WakaTime não deixa o navegador ler direto (sem CORS).
name: Horas do WakaTime

on:
  schedule:
    - cron: "17 9 * * *"   # 06:17 em São Paulo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar estatísticas
        run: python .github/scripts/wakatime.py data/wakatime.json
      - name: Commitar se mudou
        run: |
          if git diff --quiet -- data/wakatime.json; then echo "Nada mudou."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wakatime.json
          git commit -m "chore: atualiza horas do WakaTime"
          git push
